features:
  - id: time_tracking
    title_en: "Employee Time Tracking"
    summary_en: "Log hours against client campaigns with instant HTMX updates."
    slide_bullets_en:
      - "Staff log time against live campaigns in one form"
      - "Table refreshes without a full page reload"
      - "Seeded agency cast: Sarah, Alex, Max"
    route: "/"
    status: shipped
    demo:
      reset_required: true
      entrypoints:
        - "[data-testid='time-log-form']"
        - "[data-testid='employee-select']"
        - "[data-testid='campaign-select']"
        - "[data-testid='hours-input']"
        - "[data-testid='description-input']"
        - "[data-testid='submit-time-log']"
        - "[data-testid='time-log-table']"
      notes_en: "Submit a time log; confirm the recent-entries table updates via HTMX."

  - id: demo_seed_story
