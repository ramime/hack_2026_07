    summary_en: "Ritter Sport, Bosch, and Porsche campaigns with green / warning / over-budget narratives."
    slide_bullets_en:
      - "Ritter Sport — healthy budget trajectory"
      - "Bosch — warning zone near budget cap"
      - "Porsche — over-budget 'out of control' story"
    route: "/"
    status: shipped
    demo:
      reset_required: true
      entrypoints:
        - "[data-testid='campaign-select']"
        - "[data-testid='reset-demo-button']"
      notes_en: "Show campaign options after reset; highlight the three client narratives."

  - id: i18n_theme
    title_en: "i18n & Theme"
    summary_en: "German/English toggle and dark/light theme for demos."
    slide_bullets_en:
      - "One-click DE/EN switch for international pitches"
      - "Dark/light theme for stage and kiosk lighting"
    route: "/"
    status: shipped
    demo:
      reset_required: false
      entrypoints:
        - "[data-testid='lang-toggle']"
        - "[data-testid='theme-toggle']"
      notes_en: "Switch language to EN before screencast; optionally flip theme once."

  - id: demo_reset
    title_en: "One-Click Demo Reset"
    summary_en: "Restore the pitch baseline after live tinkering."
    slide_bullets_en:
