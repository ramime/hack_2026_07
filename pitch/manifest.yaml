# OWNER: Dev-Agent only — see pitch/DEV_AGENT_CONTRACT.md
version: "0.5.1"
updated_at: "2026-07-25"

features:
  - id: time_tracking
    title_en: "Employee Time Tracking"
    summary_en: "Log hours against client campaigns with instant HTMX updates."
    slide_bullets_en:
      - "Staff log time against live campaigns in one form"
      - "Table refreshes without a full page reload"
    route: "/"
    status: shipped
    demo:
      reset_required: true
      entrypoints:
        - "[data-testid='time-log-form']"
        - "[data-testid='submit-time-log']"
      notes_en: "Submit a time log on /."

  - id: budget_heatmap
    title_en: "Team Lead Budget Heatmap"
    summary_en: "Traffic-light budget drift view and AI Estimator."
    slide_bullets_en:
      - "Green / warning / danger campaign cards"
      - "AI Time & Budget Estimator"
    route: "/teamlead"
    status: shipped
    demo:
      reset_required: true
      entrypoints:
        - "[data-testid='budget-heatmap']"
        - "[data-testid='ai-estimator-open']"
      notes_en: "Open /teamlead."

  - id: executive_view
    title_en: "Executive Profitability"
    summary_en: "Revenue, labor cost, profit, margins, ElevenLabs briefing."
    slide_bullets_en:
      - "Executive KPIs at a glance"
      - "Audio briefing button"
    route: "/executive"
    status: shipped
    demo:
      reset_required: true
      entrypoints:
        - "[data-testid='executive-kpis']"
        - "[data-testid='audio-briefing-button']"
      notes_en: "Open /executive."

  - id: kiosk_tracker
    title_en: "800×480 Kiosk Tracker"
    summary_en: "Touch-optimized start/stop tracking for the studio floor."
    slide_bullets_en:
      - "Large touch campaign cards"
      - "Live stopwatches with Start/Stop"
    route: "/tracker"
    status: shipped
    demo:
      reset_required: true
      entrypoints:
        - "[data-testid='kiosk-start-btn']"
        - "[data-testid='kiosk-stop-btn']"
      notes_en: "Open /tracker; start then stop a timer."

  - id: client_portal
    title_en: "Client Portal"
    summary_en: "Opaque portal URLs with PIN authentication and transparent assets."
    slide_bullets_en:
      - "Cryptic links: /portal/c/<token>"
      - "4-digit PIN gate (demo Ritter: 1234)"
      - "Budgets and delivered assets without internal rates"
    route: "/portal/c/ritter-sport-8821"
    status: shipped
    demo:
      reset_required: true
      entrypoints:
        - "[data-testid='portal-pin-form']"
        - "[data-testid='portal-pin-input']"
        - "[data-testid='portal-submit-pin']"
        - "[data-testid='portal-content']"
      notes_en: "Open /portal/c/ritter-sport-8821, enter PIN 1234, show portal content."

  - id: demo_reset
    title_en: "One-Click Demo Reset"
    summary_en: "Restore the pitch baseline after live tinkering."
    slide_bullets_en:
      - "Footer reset restores seed data"
    route: "/"
    status: shipped
    demo:
      reset_required: false
      entrypoints:
        - "[data-testid='reset-demo-button']"
      notes_en: "Click reset."
