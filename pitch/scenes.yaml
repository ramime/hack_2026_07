# OWNER: Pitch Media pipeline ONLY — Dev-Agent: DO NOT EDIT
# Screencast scenes + English narration (burned-in captions).
# Tuned for v0.2.0-beta Team Lead Cockpit on localhost:8084.
# See: pitch/DEV_AGENT_CONTRACT.md

version: "0.2.0-beta.1"
lang: en
viewport:
  width: 1280
  height: 720

scenes:
  - id: intro
    path: "/"
    max_seconds: 6
    narration_en: "AgencyPulse — real-time budget pulse for social media agencies."
    steps: []

  - id: time_entry
    path: "/"
    max_seconds: 20
    narration_en: "Employees log hours against campaigns. The table updates instantly."
    steps:
      - action: set_caption
      - action: select
        testid: employee-select
        label_contains: "Sarah"
      - action: select
        testid: campaign-select
        label_contains: "Ritter"
      - action: fill
        testid: hours-input
        value: "1.5"
      - action: fill
        testid: description-input
        value: "Storyboard review"
      - action: click
        testid: submit-time-log
      - action: wait
        ms: 1200

  - id: teamlead_heatmap
    path: "/teamlead"
    max_seconds: 18
    narration_en: "Team Lead cockpit: Ritter healthy, Bosch at risk, Porsche over budget."
    steps:
      - action: set_caption
      - action: wait
        testid: budget-heatmap
        ms: 2500

  - id: ai_estimator
    path: "/teamlead"
    max_seconds: 16
    narration_en: "AI Estimator forecasts deliverable effort and compares it to campaign budgets."
    steps:
      - action: set_caption
      - action: click
        testid: ai-estimator-open
      - action: wait
        ms: 3500

  - id: reset
    path: "/teamlead"
    max_seconds: 10
    narration_en: "One click restores the demo baseline for the next pitch."
    steps:
      - action: click
        testid: reset-demo-button
      - action: wait
        ms: 1500
