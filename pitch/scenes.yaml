# OWNER: Pitch Media pipeline ONLY
# Screencast for v0.7.4 — slides branding + master data domain story
# Captions: solid black plate for readability

version: "0.7.5"
lang: en
viewport:
  width: 1280
  height: 720

scenes:
  - id: intro
    path: "/"
    max_seconds: 4
    narration_en: "AgencyPulse — budget pulse, portals, and master data for agencies."
    steps: []

  - id: teamlead_heatmap
    path: "/teamlead"
    max_seconds: 11
    narration_en: "Budget heatmap: Ritter healthy, Bosch at risk, Porsche over budget."
    steps:
      - action: set_caption
      - action: wait
        testid: budget-heatmap
        ms: 2000

  - id: masterdata_pins
    path: "/masterdata?tab=portal"
    max_seconds: 14
    narration_en: "Master data: portal links and PINs for every client, ready to share."
    steps:
      - action: set_caption
      - action: wait
        testid: portal-views-section
        ms: 2400

  - id: masterdata_employees
    path: "/masterdata?tab=employees"
    max_seconds: 10
    narration_en: "Employees with cost and billing rates — editable in one place."
    steps:
      - action: set_caption
      - action: wait
        testid: employees-section
        ms: 1800

  - id: client_portal
    path: "/portal/c/ritter-sport-8821"
    max_seconds: 14
    narration_en: "Client portal: PIN unlock, then transparent budgets without internal rates."
    steps:
      - action: set_caption
      - action: wait
        testid: portal-pin-form
        ms: 500
      - action: fill
        testid: portal-pin-input
        value: "1234"
      - action: click
        testid: portal-submit-pin
      - action: wait
        testid: portal-content
        ms: 1800

  - id: reset
    path: "/teamlead"
    max_seconds: 6
    narration_en: "One click restores the demo baseline."
    steps:
      - action: click
        testid: reset-demo-button
      - action: wait
        ms: 800
