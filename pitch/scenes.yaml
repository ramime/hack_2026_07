# OWNER: Pitch Media pipeline ONLY
# Screencast for v0.5.2 — domain focus, ≤2 minutes

version: "0.5.2"
lang: en
viewport:
  width: 1280
  height: 720

scenes:
  - id: intro
    path: "/"
    max_seconds: 4
    narration_en: "AgencyPulse — see budget drift before it hits the client."
    steps: []

  - id: time_entry
    path: "/"
    max_seconds: 12
    narration_en: "Staff log time against campaigns. The ledger updates instantly."
    steps:
      - action: set_caption
      - action: select
        testid: employee-select
        label_contains: "Sarah"
      - action: select
        testid: campaign-select
        label_contains: "Ritter"
      - action: fill
        testid: hours-input
        value: "1.5"
      - action: fill
        testid: description-input
        value: "Storyboard review"
      - action: click
        testid: submit-time-log
      - action: wait
        ms: 800

  - id: teamlead_heatmap
    path: "/teamlead"
    max_seconds: 14
    narration_en: "Team Lead heatmap: Ritter healthy, Bosch at risk, Porsche over budget."
    steps:
      - action: set_caption
      - action: wait
        testid: budget-heatmap
        ms: 2400

  - id: executive
    path: "/executive"
    max_seconds: 11
    narration_en: "Executive view: revenue, labor cost, profit, and agency margin."
    steps:
      - action: set_caption
      - action: wait
        testid: executive-kpis
        ms: 2200

  - id: kiosk
    path: "/tracker"
    max_seconds: 14
    narration_en: "Floor kiosk: start and stop live timers on touch campaign cards."
    steps:
      - action: set_caption
      - action: wait
        testid: kiosk-start-btn
        ms: 500
      - action: click
        testid: kiosk-start-btn
      - action: wait
        testid: kiosk-stop-btn
        ms: 1800
      - action: click
        testid: kiosk-stop-btn
      - action: wait
        ms: 700

  - id: client_portal
    path: "/portal/c/ritter-sport-8821"
    max_seconds: 16
    narration_en: "Client portal: PIN gate, then transparent budgets without internal rates."
    steps:
      - action: set_caption
      - action: wait
        testid: portal-pin-form
        ms: 600
      - action: fill
        testid: portal-pin-input
        value: "1234"
      - action: click
        testid: portal-submit-pin
      - action: wait
        testid: portal-content
        ms: 2200

  - id: reset
    path: "/teamlead"
    max_seconds: 6
    narration_en: "One click restores the demo baseline."
    steps:
      - action: click
        testid: reset-demo-button
      - action: wait
        ms: 800
