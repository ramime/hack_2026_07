<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Pulse Wave Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pulse Line Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Accent Dot Glow -->
    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Subtle Glass Glow -->
  <rect x="44" y="44" width="424" height="424" rx="100" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />

  <!-- Stylized Letter 'A' + Pulse Wave -->
  <!-- Left Entry -> Pulse Peak 1 -> Letter A Apex -> Pulse Drop -> Right Exit -->
  <path d="M 96 288 
           L 170 288 
           L 200 210 
           L 256 104 
           L 312 210 
           L 342 288 
           L 416 288" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Letter A Crossbar (Pulse Beat Line) -->
  <path d="M 184 256 L 328 256" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="26" 
        stroke-linecap="round" 
        filter="url(#glow)" />

  <!-- Pulse Heartbeat Nodes / Dots -->
  <circle cx="256" cy="104" r="18" fill="#38bdf8" filter="url(#dotGlow)" />
  <circle cx="256" cy="256" r="14" fill="#ffffff" filter="url(#dotGlow)" />
  <circle cx="416" cy="288" r="16" fill="#c084fc" filter="url(#dotGlow)" />
</svg>
