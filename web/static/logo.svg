<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="pulseGradFull" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="glowFull" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Badge (Left) -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="128" height="128" rx="32" fill="url(#iconBg)" />
    <rect x="3" y="3" width="122" height="122" rx="29" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" />
    
    <!-- Letter A + Pulse -->
    <path d="M 24 72 L 42 72 L 50 52 L 64 26 L 78 52 L 86 72 L 104 72" 
          fill="none" 
          stroke="url(#pulseGradFull)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#glowFull)" />
    
    <path d="M 46 64 L 82 64" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="7" 
          stroke-linecap="round" />

    <circle cx="64" cy="26" r="4.5" fill="#38bdf8" />
    <circle cx="104" cy="72" r="4" fill="#c084fc" />
  </g>

  <!-- Text Typography (Right) -->
  <text x="168" y="96" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="58" letter-spacing="-1.5">
    <tspan fill="#ffffff">Agency</tspan><tspan fill="url(#textGrad)">Pulse</tspan>
  </text>
</svg>
